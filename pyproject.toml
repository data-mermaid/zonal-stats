[project]
name = "zonal-stats-api"
version = "0.1.0"
description = "A FastAPI application for calculating zonal statistics from raster data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.4.2",
    "rasterio>=1.3.8",
    "rasterstats>=0.19.0",
    "geojson>=3.0.1",
    "shapely>=2.0.2",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "pyproj>=3.7.1",
    "mangum>=0.17.0",
    "requests",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 80


[tool.ruff.lint]
extend-select=[]
select = ["D103","E","F", "UP", "B","SIM","I",]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.9",
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "httpx>=0.28.1",
]
